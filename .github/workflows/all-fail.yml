# SCENARIO: all-fail
# 1000 tests — every test fails (8 distinct error types).
# 5 shards x 4 workers. continue-on-error so reports always upload.
# On manual dispatch: choose staging or production TestDino server.
name: All Fail — 1000 Tests

on:
  # push:
  # pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: 'TestDino target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  run-tests:
    name: Run shard ${{ matrix.shardIndex }}/5
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5]
        shardTotal: [5]

    env:
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      TESTDINO_SERVER_URL: ${{ github.event.inputs.environment == 'production' && 'https://reporter.testdino.com' || 'https://stg-reporter.testdino.com' }}
      TESTDINO_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install latest TestDino Playwright package
        run: |
          npm install --no-save --package-lock=false @testdino/playwright@latest
          npm ls @testdino/playwright --depth=0

      # All tests fail by design — continue-on-error ensures report upload always runs.
      - name: Run shard ${{ matrix.shardIndex }} — all-fail tests
        run: |
          npx tdpw test \
            --ci-run-id "$TESTDINO_CI_RUN_ID" \
            --server-url "$TESTDINO_SERVER_URL" \
            -- tests/all-fail.spec.ts \
            --project=chromium \
            --workers=4 \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        continue-on-error: true

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: ./blob-report
          if-no-files-found: ignore
          retention-days: 1

  merge-reports:
    name: Merge Reports
    needs: run-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: ./all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload final HTML report
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-Report-All-Fail
          path: ./playwright-report
          retention-days: 14
